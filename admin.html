
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b0a">
  <title>WICKETRA | Admin Login</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <main class="login-page">
    <a href="index.html" class="brand">
      WICKET<span>RA</span>
    </a>

    <section class="login-card">
      <div class="login-icon">🏏</div>

      <p class="eyebrow">RESTRICTED ACCESS</p>
      <h1>Admin <span>Portal</span></h1>
      <p class="description">
        Sign in to manage matches and live cricket scoring.
      </p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your admin email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit" id="loginButton">
          Sign In to Dashboard ↗
        </button>

        <p id="loginMessage" role="status"></p>
      </form>

      <p class="security-note">
        Authorized administrators only.
      </p>
    </section>

    <a href="index.html" class="back-link">
      ← Back to WICKETRA
    </a>
    <nav class="public-links" aria-label="Website information">
      <a href="about.html">About</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>

</body>
</html>
